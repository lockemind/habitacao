# Configuração do site (Zensical). Pré-visualizar: .venv/bin/zensical serve
[project]
site_name = "A crise da habitação em Portugal"
site_description = "Documento aberto para informar, explicar e apoiar o debate público sobre a habitação em Portugal."
docs_dir = "docs"
site_dir = "site"
copyright = "Versão de trabalho · todas as fontes em Referências"

